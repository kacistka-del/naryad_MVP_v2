services:
  # Backend API Server
  - type: web
    name: naryad-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: naryad-db
          property: connectionString
      - key: APP_BASE_URL
        fromService:
          name: naryad-frontend
          type: web
          property: url
      - key: PUBLIC_API_URL
        value: https://naryad-api.onrender.com
      - key: CORS_ORIGIN
        value: https://naryad-frontend.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ADMIN_EMAIL
        value: admin@naryad.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: false
      - key: BASE_CURRENCY
        value: EUR
      - key: FX_TTL_MINUTES
        value: 360
      - key: ESCROW_COMMISSION_PERCENT
        value: 8
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_UPLOAD_MB
        value: 10

  # Frontend Static Site
  - type: web
    name: naryad-frontend
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_BASE44_APP_ID
        sync: false
      - key: VITE_BASE44_APP_BASE_URL
        value: https://naryad-api.onrender.com

databases:
  - name: naryad-db
    ipAllowList: []
